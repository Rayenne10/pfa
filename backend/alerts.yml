groups:
  - name: velora-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          description: "Service {{ $labels.job }} is DOWN"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[1m]) * 100 > 0.5 # a rendre 80
        for: 0s # a rendre 20
        labels:
          severity: warning
        annotations:
          description: "High CPU usage on {{ $labels.job }} (> 80%)"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 200
        for: 20s
        labels:
          severity: warning
        annotations:
          description: "High memory usage on {{ $labels.job }} (> 200MB)"

      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_seconds * 1000 > 100
        for: 20s
        labels:
          severity: warning
        annotations:
          description: "High event loop lag on {{ $labels.job }} (> 100ms)"