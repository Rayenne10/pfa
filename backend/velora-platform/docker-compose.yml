services:

  frontend:
    build:
      context: ../../frontend
    container_name: frontend
    ports:
      - "3000:80"
  postgres:
    image: postgres:15
    container_name: velora_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: velora_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
  # =========================
  # AUTH SERVICE
  # =========================
  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://root:root@postgres:5432/velora_postgres
    depends_on:
      - postgres

  # =========================
  # USER SERVICE
  # =========================
  user-service:
    build: ./user-service
    container_name: user-service
    restart: always
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://root:root@postgres:5432/velora_postgres
    depends_on:
      - postgres

  # =========================
  # ADMIN SERVICE
  # =========================
  admin-service:
    build: ./admin-service
    container_name: admin-service
    restart: always
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://root:root@postgres:5432/velora_postgres
    depends_on:
      - postgres

  # =========================
  # CUSTOMER SERVICE
  # =========================
  customer-service:
    build: ./customer-service
    container_name: customer-service
    restart: always
    ports:
      - "3004:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://root:root@postgres:5432/velora_postgres
    depends_on:
      - postgres

  # =========================
  # DASHBOARD SERVICE
  # =========================
  dashboard-service:
    build: ./dashboard-service
    container_name: dashboard-service
    restart: always
    ports:
      - "3005:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://root:root@postgres:5432/velora_postgres
    depends_on:
      - postgres

# =========================
# NETWORK (IMPORTANT)
# =========================
networks:
  default:
    name: velora-network
volumes:
  postgres_data:
