server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  proxy_set_header X-Internal-Token "";
  add_header X-Content-Type-Options nosniff always;
  location = /healthz { access_log off; return 200 'ok'; }
  location /api/auth/ { proxy_pass http://auth-service:3000/; }
  location /api/users/ { proxy_pass http://user-service:3000/; }
  location /api/admin/ { proxy_pass http://admin-service:3000/; }
  location /api/customer/ { proxy_pass http://customer-service:3000/; }
  location /api/dashboard/ { proxy_pass http://dashboard-service:3000/; }
  location / { try_files $uri $uri/ /index.html; }
}
