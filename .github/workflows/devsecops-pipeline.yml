name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build auth-service
        working-directory: backend/velora-platform/auth-service
        run: npm install --legacy-peer-deps && npm run build --if-present
      - name: Build user-service
        working-directory: backend/velora-platform/user-service
        run: npm install --legacy-peer-deps && npm run build --if-present
      - name: Build admin-service
        working-directory: backend/velora-platform/admin-service
        run: npm install --legacy-peer-deps && npm run build --if-present
      - name: Build customer-service
        working-directory: backend/velora-platform/customer-service
        run: npm install --legacy-peer-deps && npm run build --if-present

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'
      - name: npm audit auth-service
        working-directory: backend/velora-platform/auth-service
        run: npm install --legacy-peer-deps && npm audit --audit-level=high || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all services
        working-directory: backend/velora-platform
        run: docker compose build

  monitoring-check:
    name: Verify Monitoring Config
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          wget -q https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz
          tar xzf prometheus-2.45.0.linux-amd64.tar.gz
          sudo mv prometheus-2.45.0.linux-amd64/promtool /usr/local/bin/
      - name: Validate Prometheus config
        run: promtool check config backend/velora-platform/monitoring/prometheus/prometheus.yml
      - name: Validate alert rules
        run: promtool check rules backend/velora-platform/monitoring/prometheus/alerts.yml
