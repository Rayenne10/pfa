name: Velora DevSecOps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: velora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Build, test and audit (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [auth-service, user-service, admin-service, customer-service, dashboard-service, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Resolve application directory
        run: |
          if [ '${{ matrix.app }}' = frontend ]; then echo 'APP_DIR=frontend' >> "$GITHUB_ENV"; else echo 'APP_DIR=backend/velora-platform/${{ matrix.app }}' >> "$GITHUB_ENV"; fi
      - run: npm ci --no-fund --no-audit
        working-directory: ${{ env.APP_DIR }}
      - run: npm run build
        working-directory: ${{ env.APP_DIR }}
      - name: Load compiled modules without development path aliases
        if: matrix.app != 'frontend'
        working-directory: ${{ env.APP_DIR }}
        run: node -e "process.env.JWT_SECRET='x'.repeat(64); require('./dist/app.module.js')"
      - run: npm test -- --runInBand
        if: matrix.app != 'frontend'
        working-directory: ${{ env.APP_DIR }}
      - name: Block HIGH/CRITICAL runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ env.APP_DIR }}
  configuration:
    name: Monitoring and Kubernetes configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pip install PyYAML==6.0.3
      - run: python scripts/render_kubernetes.py --check
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Validate Prometheus config, rules and alert behavior
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.0 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.0 test rules rule-tests.yml
          docker run --rm --entrypoint amtool -v "$PWD/monitoring:/etc/alertmanager:ro" prom/alertmanager:v0.34.1 check-config /etc/alertmanager/alertmanager.yml
      - run: bash -n scripts/test_compose.sh scripts/test_kubernetes.sh
  integration:
    name: Container security, Compose and Kubernetes integration
    needs: [application, configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Generate temporary lab credentials
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key in ['POSTGRES_PASSWORD', 'JWT_SECRET', 'INTERNAL_API_TOKEN']:
                  value = secrets.token_hex(32)
                  print(f'::add-mask::{value}')
                  f.write(f'{key}={value}\n')
          PY
      - name: Build all six application images
        run: docker compose build --parallel
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.75.0
      - name: Block fixable HIGH/CRITICAL application image vulnerabilities
        run: |
          mkdir -p verification
          for name in auth-service user-service admin-service customer-service dashboard-service frontend; do
            status=0
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output "verification/trivy-$name.json" "velora/$name:local" || status=$?
            python scripts/summarize_scan.py "verification/trivy-$name.json"
            test "$status" = 0
          done
      - name: Verify Compose HTTP, traces, alerts and recovery
        run: bash scripts/test_compose.sh
      - name: Verify React dashboard
        run: |
          docker compose up -d --wait --wait-timeout 240
          npm ci --prefix frontend --no-fund --no-audit
          cd frontend
          npx playwright install --with-deps chromium
          node browser-check.mjs
      - name: Stop Compose before Kubernetes port forwarding
        if: always()
        run: docker compose down --remove-orphans
      - uses: azure/setup-kubectl@v5.2.0
        with:
          version: v1.35.0
      - name: Install kind with checksum verification
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLo kind.sha256 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sed 's/kind-linux-amd64/kind/' kind.sha256 | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Verify Kubernetes rollout, tracing and alert recovery
        run: bash scripts/test_kubernetes.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: velora-verification-${{ github.run_id }}
          path: verification/
          if-no-files-found: warn
