apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: velora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.162.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4318
        - containerPort: 13133
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        args:
        - --config=/etc/otelcol/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            port: 13133
            path: /
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
