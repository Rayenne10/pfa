apiVersion: v1
kind: Namespace
metadata:
  name: velora
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: velora
data:
  otel-collector.yml: "receivers:\n  otlp:\n    protocols:\n      http:\n        endpoint:\
    \ 0.0.0.0:4318\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_mib:\
    \ 128\n    spike_limit_mib: 32\n  batch:\n    timeout: 1s\nexporters:\n  otlp/jaeger:\n\
    \    endpoint: jaeger:4317\n    tls:\n      insecure: true\nextensions:\n  health_check:\n\
    \    endpoint: 0.0.0.0:13133\nservice:\n  extensions:\n  - health_check\n  pipelines:\n\
    \    traces:\n      receivers:\n      - otlp\n      processors:\n      - memory_limiter\n\
    \      - batch\n      exporters:\n      - otlp/jaeger\n"
  prometheus.yml: "global:\n  scrape_interval: 5s\n  evaluation_interval: 5s\nrule_files:\n\
    - /etc/prometheus/alerts.yml\nalerting:\n  alertmanagers:\n  - static_configs:\n\
    \    - targets:\n      - alertmanager:9093\nscrape_configs:\n- job_name: auth-service\n\
    \  metrics_path: /metrics\n  static_configs:\n  - targets:\n    - auth-service:3000\n\
    - job_name: user-service\n  metrics_path: /metrics\n  static_configs:\n  - targets:\n\
    \    - user-service:3000\n- job_name: admin-service\n  metrics_path: /metrics\n\
    \  static_configs:\n  - targets:\n    - admin-service:3000\n- job_name: customer-service\n\
    \  metrics_path: /metrics\n  static_configs:\n  - targets:\n    - customer-service:3000\n"
  alerts.yml: "groups:\n- name: velora\n  rules:\n  - alert: ServiceDown\n    expr:\
    \ up{job=~\"(auth|user|admin|customer)-service\"} == 0\n    for: 30s\n    labels:\n\
    \      severity: critical\n    annotations:\n      summary: '{{ $labels.job }}\
    \ is unreachable'\n      description: Prometheus cannot scrape this service for\
    \ 30 seconds.\n  - alert: HighCPU\n    expr: rate(process_cpu_seconds_total{job=~\"\
    (auth|user|admin|customer)-service\"}[1m])\n      > 0.8\n    for: 1m\n    labels:\n\
    \      severity: warning\n    annotations:\n      summary: High CPU on {{ $labels.job\
    \ }}\n      description: Process uses more than 0.8 CPU cores for one minute (80%\
    \ of one\n        core).\n  - alert: HighMemory\n    expr: process_resident_memory_bytes{job=~\"\
    (auth|user|admin|customer)-service\"}\n      > 268435456\n    for: 1m\n    labels:\n\
    \      severity: warning\n    annotations:\n      summary: High RSS on {{ $labels.job\
    \ }}\n      description: Process resident memory exceeds 256 MiB.\n  - alert:\
    \ HighEventLoopLag\n    expr: nodejs_eventloop_lag_p99_seconds{job=~\"(auth|user|admin|customer)-service\"\
    }\n      > 0.1\n    for: 30s\n    labels:\n      severity: warning\n    annotations:\n\
    \      summary: High event-loop lag on {{ $labels.job }}\n      description: 99th\
    \ percentile event-loop lag exceeds 100 ms.\n"
  alertmanager.yml: "route:\n  receiver: local-webhook\n  group_by:\n  - alertname\n\
    \  - job\n  group_wait: 5s\n  group_interval: 10s\n  repeat_interval: 1h\nreceivers:\n\
    - name: local-webhook\n  webhook_configs:\n  - url: http://alert-sink:9095/alerts\n\
    \    send_resolved: true\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: velora
data:
  init.sql: '

    CREATE DATABASE user_db;

    CREATE DATABASE admin_db;

    CREATE DATABASE customer_db;'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink-script
  namespace: velora
data:
  alert_sink.py: "\"\"\"Local demo receiver: keeps the last 100 Alertmanager webhook\
    \ deliveries in RAM.\"\"\"\nimport json\nfrom http.server import BaseHTTPRequestHandler,\
    \ ThreadingHTTPServer\nfrom collections import deque\nfrom threading import Lock\n\
    \nEVENTS = deque(maxlen=100)\nLOCK = Lock()\n\nclass Handler(BaseHTTPRequestHandler):\n\
    \    def respond(self, code, body):\n        payload = json.dumps(body).encode()\n\
    \        self.send_response(code)\n        self.send_header('Content-Type', 'application/json')\n\
    \        self.send_header('Content-Length', str(len(payload)))\n        self.end_headers()\n\
    \        self.wfile.write(payload)\n\n    def do_GET(self):\n        if self.path\
    \ == '/healthz':\n            return self.respond(200, {'status': 'ok'})\n   \
    \     if self.path == '/events':\n            with LOCK:\n                events\
    \ = list(EVENTS)\n            return self.respond(200, events)\n        self.respond(404,\
    \ {})\n\n    def do_POST(self):\n        if self.path != '/alerts':\n        \
    \    return self.respond(404, {})\n        size = int(self.headers.get('Content-Length',\
    \ '0'))\n        if not 0 < size <= 1048576:\n            return self.respond(413,\
    \ {})\n        try:\n            event = json.loads(self.rfile.read(size))\n \
    \           if not isinstance(event, dict) or not isinstance(event.get('alerts'),\
    \ list):\n                raise ValueError('Invalid webhook')\n        except\
    \ (ValueError, UnicodeError):\n            return self.respond(400, {})\n    \
    \    with LOCK:\n            EVENTS.append(event)\n        self.respond(200, {'received':\
    \ True})\n\nif __name__ == '__main__':\n    ThreadingHTTPServer(('0.0.0.0', 9095),\
    \ Handler).serve_forever()\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: velora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: velora/auth-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: PORT
          value: '3000'
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://otel-collector:4318/v1/traces
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_always_on
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: '5432'
        - name: DB_SYNCHRONIZE
          value: 'true'
        - name: CORS_ORIGIN
          value: http://localhost:8080
        - name: USER_SERVICE_URL
          value: http://user-service:3000
        - name: ADMIN_SERVICE_URL
          value: http://admin-service:3000
        - name: CUSTOMER_SERVICE_URL
          value: http://customer-service:3000
        - name: PROMETHEUS_URL
          value: http://prometheus:9090
        - name: OTEL_SERVICE_NAME
          value: auth-service
        - name: DB_NAME
          value: auth_db
        - name: DB_USER
          value: velora
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: velora-secrets
              key: JWT_SECRET
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: velora-secrets
              key: INTERNAL_API_TOKEN
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: velora-secrets
              key: POSTGRES_PASSWORD
        startupProbe:
          httpGet:
            path: /healthz
            port: 3000
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: velora
spec:
  selector:
    app: auth-service
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
---
