apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: velora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-bookworm
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: POSTGRES_USER
          value: velora
        - name: POSTGRES_DB
          value: velora
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: velora-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - velora
            - -d
            - velora
          periodSeconds: 5
      automountServiceAccountToken: false
      volumes:
      - name: data
        emptyDir: {}
      - name: init
        configMap:
          name: postgres-init
---
