global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: auth-service
  metrics_path: /metrics
  static_configs:
  - targets:
    - auth-service:3000
- job_name: user-service
  metrics_path: /metrics
  static_configs:
  - targets:
    - user-service:3000
- job_name: admin-service
  metrics_path: /metrics
  static_configs:
  - targets:
    - admin-service:3000
- job_name: customer-service
  metrics_path: /metrics
  static_configs:
  - targets:
    - customer-service:3000
