rule_files:
- alerts.yml
evaluation_interval: 5s
tests:
- interval: 10s
  input_series:
  - series: up{job="auth-service"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 1m
    alertname: ServiceDown
    exp_alerts:
    - exp_labels:
        job: auth-service
        severity: critical
      exp_annotations:
        summary: auth-service is unreachable
        description: Prometheus cannot scrape this service for 30 seconds.
- interval: 10s
  input_series:
  - series: process_cpu_seconds_total{job="auth-service"}
    values: 0+10x30
  alert_rule_test:
  - eval_time: 3m
    alertname: HighCPU
    exp_alerts:
    - exp_labels:
        job: auth-service
        severity: warning
      exp_annotations:
        summary: High CPU on auth-service
        description: Process uses more than 0.8 CPU cores for one minute (80% of one
          core).
- interval: 10s
  input_series:
  - series: process_resident_memory_bytes{job="auth-service"}
    values: 300000000x30
  alert_rule_test:
  - eval_time: 2m
    alertname: HighMemory
    exp_alerts:
    - exp_labels:
        job: auth-service
        severity: warning
      exp_annotations:
        summary: High RSS on auth-service
        description: Process resident memory exceeds 256 MiB.
- interval: 10s
  input_series:
  - series: nodejs_eventloop_lag_p99_seconds{job="auth-service"}
    values: 0.2x30
  alert_rule_test:
  - eval_time: 1m
    alertname: HighEventLoopLag
    exp_alerts:
    - exp_labels:
        job: auth-service
        severity: warning
      exp_annotations:
        summary: High event-loop lag on auth-service
        description: 99th percentile event-loop lag exceeds 100 ms.
- interval: 10s
  input_series:
  - series: up{job="auth-service"}
    values: 1x30
  alert_rule_test:
  - eval_time: 2m
    alertname: ServiceDown
    exp_alerts: []
